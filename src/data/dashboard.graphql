query Dashboard(
  $reviewRequestsCursor: String
  $assignedIssuesCursor: String
  $ownedPullRequestsCursor: String
  $ownedIssuesCursor: String
  $contributedPullRequestsCursor: String
  $contributedIssuesCursor: String
  $mentionedCursor: String
  $authoredPullRequestsCursor: String
  $participatingCursor: String
  $changesRequestedCursor: String
  $failingChecksCursor: String
  $incomingPullRequestsCursor: String
) {
  # Free to select; lets us measure real query cost and back off before GitHub does.
  rateLimit {
    cost
    nodeCount
    remaining
    resetAt
  }
  viewer {
    login
    name
    avatarUrl
  }
  reviewRequests: search(
    query: "is:open is:pr review-requested:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $reviewRequestsCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
    }
  }
  assignedIssues: search(
    query: "is:open is:issue assignee:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $assignedIssuesCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...IssueCard
    }
  }
  ownedPullRequests: search(
    query: "is:open is:pr author:@me user:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $ownedPullRequestsCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
    }
  }
  ownedIssues: search(
    query: "is:open is:issue author:@me user:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $ownedIssuesCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...IssueCard
    }
  }
  contributedPullRequests: search(
    query: "is:open is:pr author:@me -user:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $contributedPullRequestsCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
    }
  }
  contributedIssues: search(
    query: "is:open is:issue author:@me -user:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $contributedIssuesCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...IssueCard
    }
  }
  mentioned: search(
    query: "is:open mentions:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $mentionedCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
      ...IssueCard
    }
  }
  authoredPullRequests: search(
    query: "is:open is:pr author:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $authoredPullRequestsCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
    }
  }
  changesRequested: search(
    query: "is:open is:pr author:@me review:changes_requested sort:updated-desc"
    type: ISSUE
    first: 20
    after: $changesRequestedCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
    }
  }
  failingChecks: search(
    query: "is:open is:pr author:@me status:failure sort:updated-desc"
    type: ISSUE
    first: 20
    after: $failingChecksCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
    }
  }
  participating: search(
    query: "is:open commenter:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $participatingCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
      ...IssueCard
    }
  }
  incomingPullRequests: search(
    query: "is:open is:pr -author:@me user:@me sort:updated-desc"
    type: ISSUE
    first: 20
    after: $incomingPullRequestsCursor
  ) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
    }
  }
}

query DashboardAttention {
  rateLimit {
    cost
    nodeCount
    remaining
    resetAt
  }
  viewer {
    login
    name
    avatarUrl
  }
  reviewRequests: search(
    query: "is:open is:pr review-requested:@me sort:updated-desc"
    type: ISSUE
    first: 20
  ) {
    ...SearchPullRequest
  }
  assignedIssues: search(
    query: "is:open is:issue assignee:@me sort:updated-desc"
    type: ISSUE
    first: 20
  ) {
    ...SearchIssue
  }
  mentioned: search(query: "is:open mentions:@me sort:updated-desc", type: ISSUE, first: 20) {
    ...SearchCard
  }
  authoredPullRequests: search(
    query: "is:open is:pr author:@me sort:updated-desc"
    type: ISSUE
    first: 20
  ) {
    ...SearchPullRequest
  }
  changesRequested: search(
    query: "is:open is:pr author:@me review:changes_requested sort:updated-desc"
    type: ISSUE
    first: 20
  ) {
    ...SearchPullRequest
  }
  failingChecks: search(
    query: "is:open is:pr author:@me status:failure sort:updated-desc"
    type: ISSUE
    first: 20
  ) {
    ...SearchPullRequest
  }
  participating: search(query: "is:open commenter:@me sort:updated-desc", type: ISSUE, first: 20) {
    ...SearchCard
  }
  # Pull requests other people opened on repositories this account owns. Nobody asked the
  # viewer for these, so nothing else in the dashboard surfaces them.
  incomingPullRequests: search(
    query: "is:open is:pr -author:@me user:@me sort:updated-desc"
    type: ISSUE
    first: 20
  ) {
    ...SearchPullRequest
  }
}

