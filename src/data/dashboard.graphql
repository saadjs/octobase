fragment SearchPullRequest on SearchResultItemConnection {
  issueCount
  pageInfo {
    hasNextPage
    endCursor
  }
  nodes {
    ...PullRequestCard
  }
}

fragment SearchIssue on SearchResultItemConnection {
  issueCount
  pageInfo {
    hasNextPage
    endCursor
  }
  nodes {
    ...IssueCard
  }
}

fragment SearchCard on SearchResultItemConnection {
  issueCount
  pageInfo {
    hasNextPage
    endCursor
  }
  nodes {
    ...PullRequestCard
    ...IssueCard
  }
}

# Cursor expansion must only select the requested connection. The monolithic Dashboard
# operation would otherwise reload every other section's first page on each cursor request.
query DashboardSectionPage($query: String!, $cursor: String) {
  rateLimit {
    cost
    nodeCount
    remaining
    resetAt
  }
  viewer {
    login
  }
  page: search(query: $query, type: ISSUE, first: 20, after: $cursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestCard
      ...IssueCard
    }
  }
}

fragment PullRequestCard on PullRequest {
  __typename
  id
  number
  title
  url
  createdAt
  updatedAt
  isDraft
  mergeable
  mergeStateStatus
  reviewDecision
  author {
    login
  }
  repository {
    nameWithOwner
    url
  }
  comments(last: 1) {
    totalCount
    nodes {
      author {
        login
      }
      createdAt
    }
  }
  reviews(last: 1) {
    nodes {
      author {
        login
      }
      createdAt
    }
  }
  statusCheckRollup {
    state
  }
  reactionGroups {
    content
    reactors {
      totalCount
    }
    viewerHasReacted
  }
  changesRequestedReviews: reviews(last: 1, states: [CHANGES_REQUESTED]) {
    nodes {
      author {
        login
      }
      createdAt
    }
  }
  reviewRequestedEvents: timelineItems(last: 10, itemTypes: [REVIEW_REQUESTED_EVENT]) {
    nodes {
      ... on ReviewRequestedEvent {
        createdAt
        requestedReviewer {
          ... on User {
            login
          }
        }
      }
    }
  }
}

fragment IssueCard on Issue {
  __typename
  id
  number
  title
  url
  createdAt
  updatedAt
  author {
    login
  }
  repository {
    nameWithOwner
    url
  }
  comments(last: 1) {
    totalCount
    nodes {
      author {
        login
      }
      createdAt
    }
  }
  labels(first: 5) {
    nodes {
      name
      color
    }
  }
  reactionGroups {
    content
    reactors {
      totalCount
    }
    viewerHasReacted
  }
  assignedEvents: timelineItems(last: 10, itemTypes: [ASSIGNED_EVENT]) {
    nodes {
      ... on AssignedEvent {
        createdAt
        assignee {
          ... on User {
            login
          }
        }
      }
    }
  }
}

# Counts only: no card fragments and `first: 1`, so all four searches cost a single
# rate-limit point. Fetched on every refresh so a tab badge is never a stale zero.
query DashboardCounts {
  rateLimit {
    cost
    nodeCount
    remaining
    resetAt
  }
  viewer {
    login
  }
  ownedPullRequests: search(
    query: "is:open is:pr author:@me user:@me sort:updated-desc"
    type: ISSUE
    first: 1
  ) {
    issueCount
  }
  ownedIssues: search(
    query: "is:open is:issue author:@me user:@me sort:updated-desc"
    type: ISSUE
    first: 1
  ) {
    issueCount
  }
  contributedPullRequests: search(
    query: "is:open is:pr author:@me -user:@me sort:updated-desc"
    type: ISSUE
    first: 1
  ) {
    issueCount
  }
  contributedIssues: search(
    query: "is:open is:issue author:@me -user:@me sort:updated-desc"
    type: ISSUE
    first: 1
  ) {
    issueCount
  }
}

# Pin type-ahead: the repositories this account actually works in, most recently pushed
# first. Filtering happens locally, so typing costs nothing.
query ViewerRepositories($first: Int!) {
  rateLimit {
    cost
    nodeCount
    remaining
    resetAt
  }
  viewer {
    login
    repositories(
      first: $first
      affiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER]
      isArchived: false
      orderBy: { field: PUSHED_AT, direction: DESC }
    ) {
      nodes {
        ...PinnableRepository
      }
    }
    repositoriesContributedTo(
      first: $first
      contributionTypes: [COMMIT, PULL_REQUEST, PULL_REQUEST_REVIEW, ISSUE]
      includeUserRepositories: false
      orderBy: { field: PUSHED_AT, direction: DESC }
    ) {
      nodes {
        ...PinnableRepository
      }
    }
  }
}

fragment PinnableRepository on Repository {
  id
  nameWithOwner
  url
  isPrivate
}
