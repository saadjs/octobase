<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link
      rel="icon"
      href="{{ '/icon-light.png' | relative_url }}"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="{{ '/icon-dark.png' | relative_url }}"
      media="(prefers-color-scheme: dark)"
    />
    <style>
      /* Octobase maps its palette onto GitHub's Primer variables; these are those same values. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted-fg: #59636e;
        --muted-bg: #f6f8fa;
        --border: #d1d9e0;
        --link: #0969da;
        --brand-accent: #f2622b;
        --radius: 6px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted-fg: #9198a1;
          --muted-bg: #151b23;
          --border: #3d444d;
          --link: #4493f8;
          --brand-accent: #ff7a45;
        }
      }
      body {
        margin: 0 auto;
        max-width: 46rem;
        padding: 2.5rem 1.25rem 6rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Mona Sans VF",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans",
          Helvetica,
          Arial,
          sans-serif;
        font-size: 0.9375rem;
        line-height: 1.6;
      }
      .masthead {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
      }
      .masthead a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2 {
        line-height: 1.25;
        margin: 2rem 0 0.75rem;
        font-weight: 600;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.125rem;
      }
      a {
        color: var(--link);
      }
      .install-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.5rem 0 2rem;
      }
      .store-button,
      .brew-install {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        min-width: 17rem;
        padding: 0.75rem 0.9rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--muted-bg);
        box-shadow: 0 1px 2px rgb(0 0 0 / 8%);
        color: var(--fg);
        text-decoration: none;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease,
          transform 120ms ease;
      }
      .store-button:hover {
        border-color: var(--brand-accent);
        box-shadow: 0 4px 12px rgb(0 0 0 / 12%);
        transform: translateY(-1px);
      }
      .store-button:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
      }
      .brew-install code {
        padding: 0;
        background: transparent;
        font-size: 0.78rem;
        white-space: nowrap;
      }
      .chrome-icon {
        position: relative;
        flex: 0 0 auto;
        width: 2.25rem;
        height: 2.25rem;
        border-radius: 50%;
        background: conic-gradient(from -30deg, #ea4335 0 33.33%, #fbbc04 0 66.66%, #34a853 0);
      }
      .chrome-icon span {
        position: absolute;
        inset: 0.52rem;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #4285f4;
      }
      .store-label {
        display: flex;
        flex: 1;
        flex-direction: column;
        line-height: 1.2;
      }
      .store-label strong {
        font-size: 1rem;
      }
      .store-eyebrow {
        color: var(--muted-fg);
        font-size: 0.72rem;
      }
      p,
      li {
        color: var(--fg);
      }
      img {
        max-width: 100%;
        height: auto;
        margin: 1.25rem 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-size: 0.9em;
      }
      th,
      td {
        border: 1px solid var(--border);
        padding: 0.5rem 0.65rem;
        text-align: left;
      }
      th {
        background: var(--muted-bg);
        font-weight: 600;
      }
      code {
        padding: 0.1em 0.35em;
        border-radius: var(--radius);
        background: var(--muted-bg);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 2.5rem 0;
      }
      blockquote,
      .muted {
        color: var(--muted-fg);
      }
    </style>
  </head>
  <body>
    <div class="masthead">
      <!-- A hearth with a merge graph under its roof, matching the extension mark. -->
      <svg
        width="24"
        height="24"
        viewBox="0 0 32 32"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M4.5 14.5 16 5l11.5 9.5V26a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 26z" />
        <path d="M11 25.5v-5L16 16" stroke-width="2" />
        <path d="M21 25.5v-5L16 16" stroke-width="2" />
        <circle cx="16" cy="14" r="2.7" fill="var(--brand-accent)" stroke="none" />
      </svg>
      <a href="{{ '/' | relative_url }}">Octobase</a>
    </div>
    {{ content }}
  </body>
</html>
